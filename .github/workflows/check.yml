name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python behavior and LuCI UI
        run: |
          python3 -m unittest discover -p 'test_*.py'
          node test_ui.cjs
      - name: Syntax and package data
        run: |
          python3 -m compileall -q files install.py
          ruby -c files/usr/libexec/wifi-data-switch/overlay.rb
          ruby -c files/usr/libexec/wifi-data-switch/boost.rb
          ruby test_boost.rb
          ruby -e "require 'yaml'; require 'json'"
          sh -n files/etc/init.d/wifi-data-switch
          sh -n files/usr/libexec/rpcd/wifi-data-switch
          python3 -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').rglob('*.json')]"
